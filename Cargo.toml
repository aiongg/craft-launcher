[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.6.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-launcher"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
artcraft-launcher-core = { path = "crates/core" }
artcraft-launcher-ui-egui = { path = "crates/ui-egui" }
artcraft-launcher-native = { path = "crates/native" }
egui = "0.37"
eframe = { version = "0.37", default-features = false }
egui_extras = { version = "0.37", default-features = false }
egui_kittest = "0.37"
# Only its `fonts` and `ime` modules; the defaults add colour glyphs and installed system fonts.
craft-ui = { git = "https://github.com/aiongg/craft-libs", rev = "7fc94afd0a925e57b84dc7650a1ef6e7ab68294c" }
craft-fonts-build = { git = "https://github.com/aiongg/craft-libs", rev = "7fc94afd0a925e57b84dc7650a1ef6e7ab68294c" }
craft-font-manager = { git = "https://github.com/aiongg/craft-libs", rev = "7fc94afd0a925e57b84dc7650a1ef6e7ab68294c", features = ["egui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
log = "0.4"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1

[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = "fat"
strip = "debuginfo"

# The suite's patched toolkit: bidi text, IME and font fixes on egui 0.37 and winit 0.30.
[patch.crates-io]
ecolor = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
eframe = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
egui = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
egui-wgpu = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
egui-winit = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
egui_extras = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
egui_kittest = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
egui_system_font_provider = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
emath = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
epaint = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
epaint_default_fonts = { git = "https://github.com/aiongg/egui", rev = "a4f9a17f64a6bae61350fb85804c9df0d9865916" }
winit = { git = "https://github.com/aiongg/winit", rev = "8b35388bd719e8cc86a95971ba0bc026c9a8f058" }
