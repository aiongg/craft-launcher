[package]
name = "artcraft-launcher-ui-egui"
description = "ArtCraft Launcher's egui interface, shared by the desktop and web builds"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
artcraft-launcher-core = { workspace = true }
egui = { workspace = true }
craft-ui = { workspace = true }
egui_extras = { workspace = true, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Real fonts for the Fonts page's fake font store: egui's Ubuntu Light.
epaint_default_fonts = "0.37"
serde = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The Fonts page: Craft Font Manager's panel, the font store and the installed fonts.
craft-font-manager = { workspace = true }
# The OS's preferred UI languages, without spawning `defaults` or `reg.exe`.
sys-locale = "0.3"
# The system's fonts, for the CJK languages in a build without craft-fonts' faces (build.rs) and
# for characters no embedded face has. Already in the build through craft-ui.
egui_system_font_provider = "0.37"
# The system time zone, so dates read as this computer's calendar; already in the desktop build.
jiff = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The browser's time zone, for the same dates.
js-sys = "0.3"
wasm-bindgen = "0.2"

[build-dependencies]
# Cuts craft-fonts' Chinese and Japanese interface faces to the catalogs' characters (build.rs).
craft-fonts-build = { workspace = true, features = ["subset"] }

[dev-dependencies]
serde_json = { workspace = true }
egui_kittest = { workspace = true, features = ["wgpu", "snapshot"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# Real fonts for the Fonts page's fake font store: egui's Ubuntu Light.
epaint_default_fonts = "0.37"
